# Copy this file to config.yaml and fill in your Zendesk subdomain.

zendesk_subdomain: yourcompany          # from https://yourcompany.zendesk.com
exchange_admin_url: https://admin.exchange.microsoft.com

browser_channel: msedge                 # msedge (built into Windows) or chrome
headless: true                          # false = watch it work in a visible window

poll_seconds: 60
ticket_query: "type:ticket status<solved"   # any Zendesk search; e.g. add group:"IT Support"
max_tickets_per_cycle: 25
my_queue_query: "type:ticket assignee:me status<solved"   # what "my tickets" means in chat

dry_run: true                           # start here: decides and logs, changes nothing
auto_close_min_confidence: 0.85
escalate_below_confidence: 0.7
solve_after_permission_change: true

models:
  triage: claude-opus-5-5
  triage_effort: low                    # fast first pass
  hard: claude-opus-5-5
  hard_effort: high                     # careful second look for access requests / unsure cases
  command: claude-opus-5-5
  command_effort: low                   # following your instructions: quick

confirm_writes: true                    # chat: confirm each change with Enter (public replies,
                                        # deletes and Exchange changes always ask)
